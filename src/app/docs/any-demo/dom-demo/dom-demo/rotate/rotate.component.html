        <div class="ais"></div>
        <div class="container" [style.z-index]="2">
            <div class="slice-4" [style.--offsetY]="'-43%'" [style.--duration]="'4s'"></div>

    </div>
    <div class="rotate">
        <div class="vhf"></div>
        <div class="container" [style.z-index]="2">
            <div class="slice-4" [style.--offsetY]="'-43%'" [style.--duration]="'4s'"></div>

            <div class="slice-1" [style.--offsetY]="'-20%'" [style.--duration]="'7s'"></div>
        </div>
        <div class="bg" [style.z-index]="1"></div>
    </div>
</div>
