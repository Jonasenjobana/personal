<div class="vxe-table-head" #tableHead [style.height.px]="headHeight">
  <table class="vxe-table" #tableRef [style.transform]="'translateX(' + transformX + 'px)'">
    <colgroup>
          @for (item of colgroupLeaf; track $index) {
            <col [style.width.px]="item.autoWidth || 50">
          }
          @if (scrollable) {
            <col [style.width.px]="gutterWidth">
          }
      </colgroup>
    <thead class="vxe-head">
      @for (header of tableHeaders; track $index; let idx = $index) {
        <tr>
          @for (item of header; track $index) {
            <td attr.rowspan="{{item.VXETYPE == 'vxe-colgroup' ? 1 : tableHeaders.length - item._level}}" attr.colspan="{{item._colspan || 1}}">
              <ng-container [ngTemplateOutlet]="item.vxeColumnTemplate" [ngTemplateOutletContext]="{col: item}"></ng-container>
            </td>
          }
          @if(scrollable && idx == 0) {
            <td attr.rowspan="{{tableHeaders.length}}"></td>
          }
      </tr>
      }
    </thead>
  </table>
</div>
