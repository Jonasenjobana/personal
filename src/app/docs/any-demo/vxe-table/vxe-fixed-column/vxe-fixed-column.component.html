<!-- 冻结列 -->
@if ((fixedRightWidth || fixedLeftWidth) && vxeWraperHeight) {
<div class="vxe-table-fixed-wraper">
  @if(fixedLeftWidth > 0) {
  <div class="vxe-fixed-left" [style.width.px]="fixedLeftWidth"
    [style.visibility]="scrollLeft == 0 ? 'hidden' : 'visible'">
    <vxe-table-head #leftHeadRef [columnConfig]="columnConfig" [wraperWidth]="wraperWidth" [headCol]="headCol"
      [fixed]="'left'"></vxe-table-head>
    <vxe-table-content #leftFixedContent [tableModel]="tableModel" [vxeWraperHeight]="vxeWraperHeight" [vData]="vData"
      [fixed]="'left'" [style.height.px]="contentHeight" [contentCol]="contentCol" [rowConfig]="rowConfig"
      [virtualConfig]="virtualConfig" [treeConfig]="treeConfig"></vxe-table-content>
  </div>
  }
  @if(fixedRightWidth > 0) {
  <div class="vxe-fixed-right"
    [style.visibility]="!rightHeadRef.headHeight || scrollLeft >= rightHeadRef.scrollWidth - headWidth ? 'hidden' : 'visible'"
    [style.width.px]="fixedRightWidth + gutterWidth">
    <vxe-table-head #rightHeadRef [columnConfig]="columnConfig" [wraperWidth]="wraperWidth" [headCol]="headCol"
      [fixed]="'right'"></vxe-table-head>
    <vxe-table-content #rightFixedContent [vData]="vData" [tableModel]="tableModel" [contentCol]="contentCol"
      [vxeWraperHeight]="vxeWraperHeight" [fixed]="'right'" [style.height.px]="contentHeight" [rowConfig]="rowConfig"
      [virtualConfig]="virtualConfig" [treeConfig]="treeConfig"></vxe-table-content>
  </div>
  }
</div>
}
